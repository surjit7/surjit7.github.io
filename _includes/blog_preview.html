<section id="blog" class="section blog-section-modern">
  <style>
    .blog-section-modern {
      padding: 64px 0;
      background: #FFFFFF;
      border-top: 1px solid #F1F5F9;
    }
    .blog-container-modern {
      max-width: 1050px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .blog-heading-modern {
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #111827;
      margin: 0 0 32px 0;
      line-height: 1.1;
      text-align: left;
    }
    .blog-section-modern .blog-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .blog-section-modern .blog-item {
      background: #F8FAFC;
      border: 1px solid #E5E7EB;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .blog-section-modern .blog-item:hover {
      transform: translateY(-4px);
      border-color: #CBD5E1;
      box-shadow: 0 12px 28px -10px rgba(15, 23, 42, 0.1);
    }
    .blog-section-modern .blog-date {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 0.78rem;
      font-weight: 600;
      color: #64748B;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
      display: block;
    }
    .blog-section-modern .blog-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.015em;
      margin: 0 0 10px 0;
    }
    .blog-section-modern .blog-title a {
      color: #0F172A;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .blog-section-modern .blog-item:hover .blog-title a {
      color: #2563EB;
    }
    .blog-section-modern .blog-excerpt {
      font-size: 0.92rem;
      line-height: 1.6;
      color: #475569;
      margin: 0;
    }
    @media (max-width: 640px) {
      .blog-section-modern {
        padding: 48px 0;
      }
      .blog-container-modern {
        padding: 0 16px;
      }
    }
  </style>

  <div class="blog-container-modern">
    <h2 class="blog-heading-modern">Latest Writing</h2>
    <ul class="blog-list">
      {% for post in site.posts limit:3 %}
      <li class="blog-item">
        <span class="blog-date">{{ post.date | date: "%B %d, %Y" }}</span>
        <h3 class="blog-title"><a href="{{ post.url }}">{{ post.title }}</a></h3>
        <p class="blog-excerpt">{{ post.excerpt | strip_html | truncate: 200 }}</p>
      </li>
      {% endfor %}
    </ul>
    <div style="text-align: center; margin-top: 40px;">
      <a href="{{ '/blog/' | relative_url }}" class="btn btn-secondary">View All Posts</a>
    </div>
  </div>
</section>
