<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <meta name="author" content="Surjit Singh">
  <meta name="keywords" content="Surjit Singh, AI Infrastructure Engineer, AI Platform Engineer, Senior Python Backend Engineer, vLLM, LangChain, PyTorch, Kubernetes, FastAPI, Django, OAuth2, OIDC, Kafka">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.url }}">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | prepend: site.url }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <meta property="og:image" content="{{ '/assets/images/og-image.jpg' | prepend: site.url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="Surjit Singh">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <meta name="twitter:image" content="{{ '/assets/images/og-image.jpg' | prepend: site.url }}">
  <meta name="twitter:creator" content="@surjit7">

  <!-- Schema.org Person Markup -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Surjit Singh",
    "url": "{{ site.url }}{{ site.baseurl }}",
    "image": "{{ '/assets/images/profile.jpg' | prepend: site.url }}",
    "email": "mailto:singhsurjit7@outlook.com",
    "description": "AI Infrastructure & Senior Python Backend Engineer with 5 years of experience specializing in self-hosted LLM platforms, Kubernetes GPU infrastructure, and distributed systems.",
    "jobTitle": "AI Platform Engineer & Senior Backend Engineer",
    "worksFor": {
      "@type": "Organization",
      "name": "BJS Home Delivery"
    },
    "alumniOf": [
      {
        "@type": "CollegeOrUniversity",
        "name": "Chandigarh University"
      },
      {
        "@type": "CollegeOrUniversity",
        "name": "Chandigarh Group of Colleges"
      }
    ],
    "sameAs": [
      "https://www.linkedin.com/in/surjitsingh7",
      "https://github.com/surjit7"
    ],
    "knowsAbout": [
      "Python", "FastAPI", "Django", "Flask", "vLLM", "PyTorch", "LangChain", "Ollama", "ChromaDB",
      "Kubernetes", "ArgoCD", "KEDA", "HashiCorp Vault", "Kafka", "Protocol Buffers",
      "OAuth2", "OIDC", "PostgreSQL", "Redis", "Distributed Systems"
    ],
    "knowsLanguage": ["English", "Hindi"],
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Mohali",
      "addressRegion": "Punjab",
      "addressCountry": "IN"
    }
  }
  </script>

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="64x64" href="{{ '/assets/images/favicon.png' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}">
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
